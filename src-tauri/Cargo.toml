[package]
name = "lightdeck"
version = "0.1.0"
description = "A lightweight desktop widget for controlling Matter lights and plugs"
authors = ["KabirRao1"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lightdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
# Must match the versions used by Tauri's webview (wry) so the WebView2 interfaces line up.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
